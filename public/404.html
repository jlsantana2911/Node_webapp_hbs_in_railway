<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101522" />
    <title>404 — Page not found</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #101522;
            color: #f4f7ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 2rem;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 50% 40%, rgb(78 103 255 / 20%), transparent 48%),
                #101522;
        }

        main {
            width: min(100%, 38rem);
            padding: clamp(2rem, 8vw, 4.5rem);
            text-align: center;
            border: 1px solid rgb(255 255 255 / 10%);
            border-radius: 1.5rem;
            background: rgb(255 255 255 / 4%);
            box-shadow: 0 2rem 6rem rgb(0 0 0 / 25%);
            backdrop-filter: blur(12px);
        }

        .eyebrow {
            margin: 0 0 0.5rem;
            color: #a9b5ff;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #fff;
            font-size: clamp(6rem, 25vw, 10rem);
            line-height: 0.95;
            letter-spacing: -0.09em;
            text-shadow: 0 0 3rem rgb(110 126 255 / 35%);
        }

        h2 {
            margin: 1.5rem 0 0.75rem;
            font-size: clamp(1.5rem, 5vw, 2rem);
        }

        .message {
            margin: 0 auto 2rem;
            max-width: 28rem;
            color: #aab3c5;
            line-height: 1.7;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 3rem;
            padding: 0.75rem 1.4rem;
            border-radius: 999px;
            background: #a9b5ff;
            color: #101522;
            font-weight: 700;
            text-decoration: none;
            transition: transform 160ms ease, background 160ms ease;
        }

        a:hover {
            transform: translateY(-2px);
            background: #c4ccff;
        }

        a:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 4px;
        }
    </style>
</head>

<body>
    <main>
        <p class="eyebrow">Lost in space</p>
        <h1>404</h1>
        <h2>This page went off the map.</h2>
        <p class="message">The page you’re looking for may have moved, been removed, or never existed.</p>
        <a href="/">Take me home</a>
    </main>
</body>

</html>
